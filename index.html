<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>my_portfolio is live</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #101418;
        --panel: rgba(255, 255, 255, 0.08);
        --text: #f4f7fb;
        --muted: #aeb8c5;
        --line: rgba(255, 255, 255, 0.18);
        --accent: #49d0b4;
        --accent-2: #f3c969;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at top left, rgba(73, 208, 180, 0.28), transparent 34rem),
          radial-gradient(circle at bottom right, rgba(243, 201, 105, 0.18), transparent 30rem),
          var(--bg);
        color: var(--text);
        display: grid;
        place-items: center;
        padding: 32px;
      }

      main {
        width: min(920px, 100%);
        border: 1px solid var(--line);
        border-radius: 8px;
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.05));
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.32);
        padding: clamp(28px, 6vw, 64px);
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: var(--accent);
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 24px var(--accent);
      }

      h1 {
        margin: 22px 0 16px;
        max-width: 12ch;
        font-size: clamp(44px, 9vw, 94px);
        line-height: 0.92;
        letter-spacing: 0;
      }

      p {
        max-width: 62ch;
        margin: 0;
        color: var(--muted);
        font-size: clamp(18px, 2vw, 22px);
        line-height: 1.6;
      }

      .details {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 1px;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 8px;
        margin-top: 42px;
        background: var(--line);
      }

      .details div {
        min-width: 0;
        background: rgba(16, 20, 24, 0.82);
        padding: 18px;
      }

      .details span {
        display: block;
        margin-bottom: 8px;
        color: var(--muted);
        font-size: 13px;
      }

      .details strong,
      .details a {
        color: var(--text);
        font-size: 16px;
        font-weight: 700;
        overflow-wrap: anywhere;
      }

      .details a {
        text-decoration-color: var(--accent-2);
        text-underline-offset: 4px;
      }

      @media (max-width: 720px) {
        body {
          padding: 18px;
        }

        main {
          padding: 28px;
        }

        .details {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="status"><span class="dot"></span>GitHub Pages test</div>
      <h1>my_portfolio</h1>
      <p>
        Если ты видишь эту страницу на своем домене или на GitHub Pages,
        значит репозиторий успешно хостится и готов к настоящему портфолио.
      </p>

      <section class="details" aria-label="Deployment details">
        <div>
          <span>Repository</span>
          <a href="https://github.com/planessick/my_portfolio">planessick/my_portfolio</a>
        </div>
        <div>
          <span>Branch</span>
          <strong>main</strong>
        </div>
        <div>
          <span>Status</span>
          <strong>Live check ready</strong>
        </div>
      </section>
    </main>
  </body>
</html>
